<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LFM3 채팅</title>
<style>
:root{
  --bg:#ffffff; --bg-side:#f9f9f9; --bg-hover:#ececec; --bg-user:#f4f4f4; --bg-input:#f4f4f4; --bg-pop:#ffffff;
  --text:#0d0d0d; --muted:#6b6b6b; --border:#e5e5e5; --accent:#0d0d0d; --accent-text:#fff;
  --code-bg:#0d0d0d; --code-text:#f4f4f4; --danger:#d93025; --shadow:0 8px 30px rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#212121; --bg-side:#181818; --bg-hover:#2a2a2a; --bg-user:#303030; --bg-input:#303030; --bg-pop:#2f2f2f;
    --text:#ececec; --muted:#a0a0a0; --border:#3a3a3a; --accent:#ececec; --accent-text:#0d0d0d; --shadow:0 8px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#212121; --bg-side:#181818; --bg-hover:#2a2a2a; --bg-user:#303030; --bg-input:#303030; --bg-pop:#2f2f2f;
  --text:#ececec; --muted:#a0a0a0; --border:#3a3a3a; --accent:#ececec; --accent-text:#0d0d0d; --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:flex;height:100dvh}

/* sidebar */
.side{width:260px;background:var(--bg-side);display:flex;flex-direction:column;padding:8px;flex-shrink:0;transition:margin .2s}
.side.hidden{margin-left:-260px}
.side-top{display:flex;justify-content:space-between;margin-bottom:4px}
.row-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-size:14px;text-align:left}
.row-btn:hover,.icon-btn:hover,.chat-item:hover{background:var(--bg-hover)}
.search{display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:10px;height:38px;color:var(--muted)}
.search:focus-within{background:var(--bg-hover)}
.search input{flex:1;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:14px;min-width:0}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.chat-list{flex:1;overflow:auto;margin-top:6px}
.chat-label{font-size:12px;color:var(--muted);padding:12px 10px 4px}
.chat-item{display:flex;align-items:center;gap:4px;border-radius:10px;padding:0 4px 0 10px;height:38px;font-size:14px}
.chat-item.active{background:var(--bg-hover)}
.chat-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;line-height:38px}
.chat-item .del{opacity:0;width:28px;height:28px;border-radius:6px;color:var(--muted)}
.chat-item:hover .del,.chat-item.active .del{opacity:1}
.chat-item .del:hover{color:var(--danger)}
.side-bottom{border-top:1px solid var(--border);padding-top:8px}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:4px;padding:8px 12px;height:56px;position:relative}
.model-btn{display:flex;align-items:center;gap:6px;font-size:18px;padding:6px 12px;border-radius:12px}
.model-btn:hover{background:var(--bg-hover)}
.model-btn .sub{color:var(--muted);font-size:14px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status-dot.ok{background:#22c55e}.status-dot.bad{background:var(--danger)}
.scroll{flex:1;overflow:auto;scroll-behavior:smooth}
.col{max-width:768px;margin:0 auto;padding:0 16px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:16px}
.empty h1{font-size:28px;font-weight:600;margin:0}

.msg{padding:12px 0;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.msg.user .bubble{background:var(--bg-user);border-radius:22px;padding:10px 18px;max-width:80%;white-space:pre-wrap;word-break:break-word}
.msg.user img.att{max-width:240px;max-height:240px;border-radius:14px;margin-bottom:6px;display:block}
.md{min-width:0;word-break:break-word}
.md p{margin:0 0 12px}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{margin:18px 0 8px;line-height:1.3}
.md h1{font-size:1.5em}.md h2{font-size:1.25em}.md h3{font-size:1.1em}
.md ul,.md ol{margin:0 0 12px;padding-left:24px}
.md code{background:var(--bg-user);padding:2px 6px;border-radius:6px;font:0.88em ui-monospace,SFMono-Regular,Menlo,monospace}
.md pre{background:var(--code-bg);color:var(--code-text);border-radius:12px;margin:0 0 12px;overflow:hidden}
.md pre .ph{display:flex;justify-content:space-between;padding:6px 14px;font-size:12px;color:#aaa;background:#2a2a2a}
.md pre .ph button{font-size:12px;color:#aaa}.md pre .ph button:hover{color:#fff}
.md pre code{display:block;background:none;padding:14px;overflow:auto;color:inherit;font-size:13.5px;line-height:1.5}
.md a{color:#2563eb}
.md blockquote{margin:0 0 12px;padding-left:14px;border-left:3px solid var(--border);color:var(--muted)}
.md .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 12px;max-width:100%}
.md table{border-collapse:collapse;font-size:14.5px;width:max-content;min-width:100%}
.md th,.md td{border:1px solid var(--border);padding:7px 11px;vertical-align:top;text-align:left;line-height:1.45}
.md th{background:var(--bg-user);font-weight:600}
.md pre .ph .phb{display:flex;gap:14px}
.modes{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 0}
.modes:empty{display:none}
.mode{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#2563eb;background:rgba(37,99,235,.1);border-radius:999px;padding:2px 4px 2px 12px}
.mode button{width:20px;height:20px;border-radius:50%;font-size:11px;color:inherit}
.mode button:hover{background:rgba(37,99,235,.18)}
.steps .tr{font-size:13.5px}
.cv-card{display:flex;align-items:center;gap:12px;width:100%;max-width:420px;text-align:left;border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin:6px 0 10px;background:var(--bg-user)}
.cv-card:hover{background:var(--bg-hover)}
.cv-card .cv-ico{font-size:22px;line-height:1}
.cv-card b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.cv-card small{color:var(--muted);font-size:12.5px}
/* Canvas */
.canvas{display:none;width:min(48vw,680px);flex-shrink:0;flex-direction:column;border-left:1px solid var(--border);background:var(--bg);min-width:0}
.canvas.on{display:flex}
.cv-top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border)}
.cv-top input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font:inherit;font-weight:600;font-size:15px;padding:6px 8px;border-radius:8px}
.cv-top input:focus{background:var(--bg-hover)}
.cv-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.cv-tabs{display:inline-flex;background:var(--bg-user);border-radius:10px;padding:2px}
.cv-tab{padding:4px 12px;border-radius:8px;font-size:13px;color:var(--muted)}
.cv-tab.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cv-bar .sp{flex:1}
.cv-bar .sm{font-size:13px;padding:4px 10px;border-radius:8px;color:var(--muted)}
.cv-bar .sm:hover{background:var(--bg-hover);color:var(--text)}
.cv-ver{font-size:12.5px;color:var(--muted);min-width:34px;text-align:center}
.cv-body{flex:1;min-height:0;position:relative}
.cv-body>*{position:absolute;inset:0;width:100%;height:100%}
#cvFrame{border:0;background:#fff;display:none}
#cvDoc{overflow:auto;padding:16px 20px;display:none}
#cvCode{resize:none;border:0;outline:0;background:var(--bg);color:var(--text);font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:14px 16px;tab-size:2;white-space:pre;overflow:auto}
.cv-err{display:none;align-items:center;gap:8px;padding:6px 12px;background:rgba(217,48,37,.1);color:var(--danger);font-size:13px}
.cv-err span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-err button{border:1px solid currentColor;border-radius:999px;padding:2px 12px;font-size:12.5px}
.cv-out{margin:0;padding:14px 16px;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.cv-out .e{color:var(--danger)}.cv-out .s{color:var(--muted)}
.cv-run{background:var(--accent);color:var(--accent-text)!important;border-radius:8px}
.cv-tbl{overflow:auto}
.cv-acts{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--border)}
.cv-acts button{font-size:12.5px;border:1px solid var(--border);border-radius:999px;padding:4px 12px;color:var(--muted)}
.cv-acts button:hover{background:var(--bg-hover);color:var(--text)}
/* 패치노트 */
.patch{max-width:520px}
.pv-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 4px;font-size:15px}
.pv-h:first-child{margin-top:0}
.pv-h span{font-size:12px;color:var(--muted)}
.pv-l{margin:0;padding-left:20px;font-size:14px;line-height:1.55}
.pv-l li{margin:5px 0}
.status{font-size:14px;color:var(--muted);margin:0 0 8px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.srcs a{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 10px;text-decoration:none}
.srcs b{font-weight:600;color:inherit}
.cursor::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--text);margin-left:4px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.actions{display:flex;gap:2px;margin-top:4px;margin-left:-8px}
.actions button{width:32px;height:32px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.actions button:hover{background:var(--bg-hover);color:var(--text)}
.err{color:var(--danger);font-size:14px}

.think{margin:0 0 10px;font-size:14px;color:var(--muted)}
.think summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:2px 0}
.think summary::-webkit-details-marker{display:none}
.think summary::after{content:"›";transition:transform .15s}
.think[open] summary::after{transform:rotate(90deg)}
.think.live summary{animation:pulse 1.4s infinite}
.think .tr{white-space:pre-wrap;border-left:2px solid var(--border);padding:4px 0 4px 12px;margin-top:4px;line-height:1.5}

.memnote{margin:6px 0 2px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:8px}
.memnote summary{cursor:pointer;list-style:none}
.memnote summary::-webkit-details-marker{display:none}
.memnote .tr{white-space:pre-wrap;margin-top:6px;line-height:1.5}

/* composer */
.composer-wrap{padding:0 16px calc(12px + env(safe-area-inset-bottom));position:relative}
.composer{max-width:768px;margin:0 auto;background:var(--bg-input);border-radius:28px;padding:8px 10px 8px 10px;display:flex;flex-direction:column;gap:6px}
.preview{display:none;gap:8px;padding:6px 4px 0}
.preview.on{display:flex}
.preview .pv{position:relative}
.preview img{width:64px;height:64px;object-fit:cover;border-radius:12px;display:block}
.preview .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-text);font-size:12px;line-height:20px}
.row{display:flex;align-items:flex-end;gap:4px}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--text);font:inherit;max-height:200px;padding:8px 4px;min-height:40px}
textarea::placeholder{color:var(--muted)}
.send{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;flex-shrink:0;margin:0 0 2px 2px}
.send:disabled{opacity:.3;cursor:default}
.icon-btn.rec{background:#ef4444;color:#fff;animation:recp 1s infinite}
.icon-btn.wait{opacity:.5;pointer-events:none}
@keyframes recp{50%{opacity:.6}}
.foot{text-align:center;font-size:12px;color:var(--muted);padding-top:8px}

/* popovers */
.pop{position:absolute;background:var(--bg-pop);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:6px;z-index:12;min-width:240px;display:none}
.pop.on{display:block}
.pop.up{bottom:calc(100% - 6px);left:calc(50% - 384px + 16px)}
@media (max-width:820px){.pop.up{left:16px}}
.pop.down{top:48px;left:12px;min-width:300px}
.pop .opt{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:10px;text-align:left;font-size:15px}
.pop .opt:hover{background:var(--bg-hover)}
.pop .opt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.pop .opt .grow{flex:1}
.pop .ttl{font-size:12px;color:var(--muted);padding:8px 12px 2px}
.pop .note{font-size:12.5px;color:var(--muted);padding:6px 12px 8px;line-height:1.4}

/* voice chat bar (대화 안에 통합된 음성 모드) */
.voicebar{display:none;max-width:768px;margin:0 auto;align-items:center;justify-content:space-between;gap:12px;background:var(--bg-input);border-radius:28px;padding:10px 14px}
body.voice .composer{display:none}
body.voice .voicebar{display:flex}
.vmid{display:flex;align-items:center;gap:14px;flex:1;justify-content:center;cursor:pointer;min-width:0}
.orb{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 30%,#fff,#a9c9ff 40%,#3b6cf6 85%);transform:scale(calc(1 + var(--lvl,0) * .45));transition:transform .09s}
.voicebar[data-st="thinking"] .orb{animation:orbt 1.1s ease-in-out infinite}
.voicebar[data-st="speaking"] .orb{animation:orbs .8s ease-in-out infinite alternate}
@keyframes orbt{50%{transform:scale(.8);opacity:.7}}
@keyframes orbs{from{transform:scale(.95)}to{transform:scale(1.25)}}
.vtext{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--bg-hover)}
.vbtn.end{background:#ef4444;color:#fff}
.vbtn.off{background:var(--accent);color:var(--accent-text)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:20;padding:16px}
.modal-bg.on{display:grid}
.modal{background:var(--bg);border-radius:20px;padding:22px;width:100%;max-width:480px;max-height:90dvh;overflow:auto;border:1px solid var(--border)}
.modal h2{margin:0 0 14px;font-size:18px}
.modal label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--bg-input);color:var(--text);padding:9px 12px;font:inherit;font-size:14px;min-height:0}
.modal label.chk{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;margin-top:16px}
.modal label.chk input{width:auto}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal .btns button{padding:9px 18px;border-radius:999px;font-size:14px;border:1px solid var(--border)}
.modal .btns .pri{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--accent);color:var(--accent-text);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw}

@media (max-width:760px){
  .side{position:fixed;inset:0 auto 0 0;z-index:15;width:280px;margin-left:-280px;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{margin-left:0}
  .side.hidden{margin-left:-280px}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:14}
  .scrim.on{display:block}
  .msg.user .bubble{max-width:90%}
  .canvas{position:fixed;inset:0;width:100%;z-index:16;border:0}
  .pop.down{min-width:0;right:12px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="side-top">
      <button class="icon-btn" id="closeSide" title="사이드바 닫기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <button class="row-btn" id="newBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4Z"/></svg>
      새 채팅
    </button>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchIn" placeholder="채팅 검색" autocomplete="off">
    </label>
    <div class="chat-list" id="chatList"></div>
    <div class="side-bottom">
      <button class="row-btn" id="themeBtn">🌓 테마 전환</button>
      <button class="row-btn" id="settingsBtn">⚙️ 설정</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <section class="main">
    <header class="top">
      <button class="icon-btn" id="openSide" title="사이드바 열기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <button class="model-btn" id="modelBtn">
        <span class="status-dot" id="dot"></span><b id="modelName" style="font-weight:600">LFM3 VL</b><span class="sub" id="effLabel"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="pop down" id="modelMenu"></div>
    </header>
    <div class="scroll" id="scroll"><div class="col" id="msgs"></div></div>
    <div class="composer-wrap">
      <div class="pop up" id="plusMenu">
        <button class="opt" id="mAttach">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
          이미지 첨부
        </button>
        <button class="opt" id="mSettings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3h0a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5h0a1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8v0a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1Z"/></svg>
          설정
        </button>
        <div class="ttl">도구</div>
        <button class="opt" id="mWeb">웹 검색</button>
        <button class="opt" id="mDeep">딥 리서치</button>

/* ---------- markdown (자체 구현, HTML 이스케이프 우선) ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function inline(s){
  s=esc(s);
  var codes=[];
  s=s.replace(/`([^`\n]+)`/g,function(_,c){codes.push(c);return "\u0000"+(codes.length-1)+"\u0000"});
  s=s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/\u0000(\d+)\u0000/g,function(_,i){return "<code>"+codes[+i]+"</code>"});
  return s;
}
function md(src){
  var out=[],lines=src.split("\n"),i=0,para=[];
  function flush(){if(para.length){out.push("<p>"+inline(para.join("\n")).replace(/\n/g,"<br>")+"</p>");para=[]}}
  while(i<lines.length){
    var L=lines[i],m;
    if((m=L.match(/^```(\w*)/))){
      flush();var buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++}
      i++;
      out.push('<pre><div class="ph"><span>'+esc(m[1]||"code")+'</span><span class="phb">'+(/^(js|javascript|mjs|node|py|python)$/i.test(m[1])?'<button data-run>▶ 실행</button>':"")+(buf.length>=6||/^(html|svg|markdown|md|mermaid|json|csv|css)$/i.test(m[1])||buf.join("").length>=200?'<button data-cv>Canvas</button>':"")+'<button data-copy>복사</button></span></div><code>'+esc(buf.join("\n"))+"</code></pre>");
      continue;
    }
    if((m=L.match(/^(#{1,3})\s+(.*)/))){flush();out.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">");i++;continue}
    if(L.indexOf("|")>=0&&i+1<lines.length&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[i+1])){
      flush();
      var cellsOf=function(s){
        s=s.trim().replace(/\\\|/g,"\u0001");
        if(s.charAt(0)==="|")s=s.slice(1);
        if(s.slice(-1)==="|")s=s.slice(0,-1);
        return s.split("|").map(function(x){return x.trim().replace(/\u0001/g,"|")});
      };
      var head=cellsOf(L),sep=cellsOf(lines[i+1]);
      var al=sep.map(function(x){return /^:-+:$/.test(x)?"center":/^-+:$/.test(x)?"right":""});
      var sty=function(j){return al[j]?' style="text-align:'+al[j]+'"':""};
      i+=2;var rows=[];
      while(i<lines.length&&lines[i].indexOf("|")>=0&&lines[i].trim()!==""){rows.push(cellsOf(lines[i]));i++}
      var th=head.map(function(h,j){return "<th"+sty(j)+">"+inline(h)+"</th>"}).join("");
      var tb=rows.map(function(r){return "<tr>"+head.map(function(_,j){return "<td"+sty(j)+">"+inline(r[j]||"")+"</td>"}).join("")+"</tr>"}).join("");
      out.push('<div class="tw"><table><thead><tr>'+th+"</tr></thead><tbody>"+tb+"</tbody></table></div>");
      continue;
    }
    if(/^\s*[-*]\s+/.test(L)){flush();var li=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){li.push("<li>"+inline(lines[i].replace(/^\s*[-*]\s+/,""))+"</li>");i++}out.push("<ul>"+li.join("")+"</ul>");continue}
    if(/^\s*\d+\.\s+/.test(L)){flush();var ol=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){ol.push("<li>"+inline(lines[i].replace(/^\s*\d+\.\s+/,""))+"</li>");i++}out.push("<ol>"+ol.join("")+"</ol>");continue}
    if(/^>\s?/.test(L)){flush();var q=[];while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,""));i++}out.push("<blockquote>"+inline(q.join("\n")).replace(/\n/g,"<br>")+"</blockquote>");continue}
    if(L.trim()===""){flush();i++;continue}
    para.push(L);i++;
  }
  flush();return out.join("");
}

  return st+th+pre+'<div class="md'+((live&&m.text)?" cursor":"")+'">'+body+"</div>"+srcs+who+act;

var HARD_RE=/분석|비교|설계|코드|프로그램|알고리즘|증명|계산|논리|논문|보고서|전략|장단점|왜 |이유|원인|자세히|단계별|구현|디버그|오류|에러|refactor|explain|analy|compare|design|code|proof/i;
function pickModel(c,hasCtx){
  if(cfg.chatm!=="auto")return Promise.resolve(cfg.chatm);
  var u=lastUser(c),t=(u&&u.text)||"";
  if(cfg.deep&&!(u&&u.img))return Promise.resolve("nano");                             // 딥 리서치 보고서: 빠른 나노(미니를 직접 고르면 미니)
  if(cfg.canvas||hasCtx||(u&&u.img))return Promise.resolve("mini");                    // 이런 작업은 미니
  var fallback=(t.length>=160||HARD_RE.test(t))?"mini":"nano";                       // 라우터가 안 되면 키워드 규칙
  if(!t)return Promise.resolve("nano");
  var ac=new AbortController(),to=setTimeout(function(){ac.abort()},2500);
  return fetch(base()+"/route",{method:"POST",headers:headers(),signal:ac.signal,body:JSON.stringify({text:t.slice(0,600)})})
    .then(function(r){return r.ok?r.json():null})
    .then(function(j){clearTimeout(to);return (j&&(j.model==="mini"||j.model==="nano"))?j.model:fallback})
    .catch(function(){clearTimeout(to);return fallback});
}

function makeQuery(q){
  var msgs=[{role:"system",content:"Task: rewrite the user's text as a short English web search query (2-8 words). Output only the query."}];
  QSHOTS.forEach(function(x){msgs.push({role:"user",content:"Question: "+x[0]});msgs.push({role:"assistant",content:x[1]})});
  msgs.push({role:"user",content:"Question: "+q});
  return llm(msgs,30).then(okQuery).catch(function(e){if(e.name==="AbortError")throw e;return ""});
}
// "그건 얼마야?"처럼 짧은 후속 질문이면 이전 질문을 앞에 붙여 검색한다
function withContext(c,q){
  var prev=lastUser(c,1);
  return (q.length<16&&prev&&prev.text)?prev.text.replace(URL_RE,"").trim().slice(0,80)+" "+q:q;
}
function srcBlock(list,cap){
  var total=0,out=[];
  list.forEach(function(r,i){
    var body=r.content||r.snippet||"";if(!body)return;
    var t="["+(i+1)+"] "+r.title+" ("+r.url+")\n"+body.slice(0,cap);
    if(total+t.length>8000)return;total+=t.length;out.push(t);
  });
  return out.join("\n\n");
}
function cleanSrcs(arr){return (arr||[]).filter(function(s){return /^https?:\/\//.test(s.url)})}

// 링크가 들어 있으면 그 페이지를 서버가 열어서 읽는다
function readLinks(c,a,paint,urls,q){
  a.status="링크 읽는 중…";paint();
  return Promise.all(urls.map(function(u){
    return jget("/fetch",{url:u,q:q,max:4500}).catch(function(e){if(e.name==="AbortError")throw e;return {url:u,ok:false,error:"검색 서버에 연결하지 못했습니다"}});
  })).then(function(res){
    a.status="";a.sources=res.map(function(r,i){return {title:r.title||urls[i],url:/^https?:\/\//.test(r.url)?r.url:urls[i]}});
    var parts=res.map(function(r,i){
      if(!r.ok)return "[링크 "+(i+1)+"] "+urls[i]+"\n읽기 실패: "+r.error;
      if(r.empty)return "[링크 "+(i+1)+"] "+r.title+" ("+r.url+")\n(제목만 확인됨. 본문은 비어 있음: 로그인·스크립트가 필요하거나 접근이 제한된 페이지일 수 있음)";
      return "[링크 "+(i+1)+"] "+r.title+" ("+r.url+")\n"+r.text;
    });
    var failed=res.some(function(r){return !r.ok||r.empty});
    if(failed)a.searchErr="일부 링크는 내용을 읽지 못했어요 (사이트가 막았거나 로그인이 필요할 수 있어요).";
    paint();
    var base_="사용자가 보낸 링크의 내용입니다. 이 내용을 근거로 답하세요. 읽지 못한 링크는 읽지 못했다고 솔직히 말하고 내용을 추측하지 마세요. 제목만 알면 제목에서 알 수 있는 것만 말하세요.\n\n"+parts.join("\n\n");
    var title=(res.filter(function(r){return r.title})[0]||{}).title;
    if(cfg.web&&title&&res.every(function(r){return !r.ok||r.empty})){      // 본문을 못 읽었으면 제목으로 검색해 배경 정보를 보탠다
      var linkSrcs=a.sources;
      return webSearch(c,a,paint,title).then(function(more){
        a.sources=(a.sources||[]).concat(linkSrcs);paint();
        return base_+(more?"\n\n페이지 제목으로 웹 검색한 결과(링크 자체의 내용은 아닙니다):\n"+more:"");
      });
    }
    return base_;
  });
}

// 일반 웹 검색: 영어·한국어 검색어 → 여러 소스 → 위쪽 페이지 본문 발췌(서버가 병렬로 읽고, 충분하면 일찍 끝냄)
function webSearch(c,a,paint,q){
  var qctx=withContext(c,q);
  var en=/[가-힣]/.test(qctx)?(a.status="검색어 만드는 중…",paint(),makeQuery(qctx)):Promise.resolve(okQuery(qctx));
  return en.then(function(e){
    a.status="웹 검색 중…";paint();
    return jget("/search",{q:qctx,en:e,read:4,budget:2200});
  }).then(function(j){
    a.status="";a.sources=cleanSrcs(j.results).slice(0,6);paint();
    if(!a.sources.length){a.searchErr="검색 결과가 없어서 검색 없이 답합니다.";paint();return null}
    return "다음은 방금 웹에서 검색한 결과입니다(본문을 읽은 것은 내용이 길게 나옵니다). 이 정보를 근거로 답하고, 근거가 된 문장 뒤에 [번호]로 출처를 표시하세요. 검색 결과에 답이 없으면 없다고 말하고 추측하지 마세요.\n\n"+srcBlock(a.sources,2000);
  }).catch(function(e){
    if(e.name==="AbortError")throw e;
    a.status="";a.searchErr="웹 검색에 실패해서 검색 없이 답합니다.";paint();return null;
  });
}

function pmap(items,n,fn){
  var i=0,res=[];
  function worker(){if(i>=items.length)return Promise.resolve();var k=i++;return fn(items[k],k).then(function(r){res[k]=r}).then(worker)}
  var ws=[];for(var w=0;w<Math.min(n,items.length);w++)ws.push(worker());
  return Promise.all(ws).then(function(){return res});
}
var PLAN_SHOTS=[["전기차 배터리 오래 쓰는 법","how to extend EV battery lifespan\nEV battery degradation causes\nbest charging habits electric vehicle battery\nEV battery temperature effects on lifespan"]];
function urlKey(u){return u.replace(/^https?:\/\/(www\.)?/,"").replace(/\/+$/,"")}
function parseQueries(t,max){return t.split("\n").map(function(l){return okQuery(l.replace(/^[-*\d.)\s]+/,""))}).filter(function(x,i,arr){return x&&arr.indexOf(x)===i}).slice(0,max)}

// 딥 리서치(2단계): 1) 검색어 4개 → 검색·본문 읽기 → 페이지별 노트 2) 부족한 부분을 스스로 찾아 추가 검색·노트 → 3) 모은 노트로 긴 보고서(run 이 스트리밍)
function deepResearch(c,a,paint,q){
  a.steps=[];
  function step(t){a.steps.push({t:t,done:false});paint()}
  function end(t){var s=a.steps[a.steps.length-1];if(s){s.done=true;if(t)s.t=t}paint()}
  function upd(t){var s=a.steps[a.steps.length-1];if(s){s.t=t;paint()}}
  var qctx=withContext(c,q),pages=[],seen={},notes=[];
  function runSearch(qs,round){
    var n=0;
    return Promise.all(qs.map(function(en,i){
      return jget("/search",{q:(round===1&&i===0)?qctx:en,en:en,read:5,budget:3000}).then(function(j){n++;upd("검색하고 페이지 읽는 중 ("+n+"/"+qs.length+")");return j.results||[]}).catch(function(e){if(e.name==="AbortError")throw e;return []});
    })).then(function(lists){
      var fresh=[];
      lists.forEach(function(l){cleanSrcs(l).forEach(function(r){var k=urlKey(r.url);if(!seen[k]){seen[k]=1;pages.push(r);fresh.push(r)}})});
      return fresh;
    });
  }
  function takeNotes(fresh,max){
    var read=fresh.filter(function(r){return r.content&&r.content.length>150}).slice(0,max),done=0;
    if(!read.length)return Promise.resolve();
    step("노트 정리 중 (0/"+read.length+")");
    return pmap(read,2,function(r){
      return llm([{role:"system",content:"You extract facts from a web page for a research question."},
        {role:"user",content:"질문: "+qctx+"\n\n페이지 본문:\n"+r.content.slice(0,1600)+"\n\n위 본문에서 질문에 직접 답하는 사실만 한국어 불릿 3~6개로 쓰세요. 모든 문장은 한국어로 쓰고(영어 용어는 괄호 안에 한 번만), 숫자·날짜·이름은 본문 그대로 쓰세요. 본문에 없는 내용은 쓰지 마세요. 질문과 비슷하지만 다른 주제(예: 다른 종류의 제품·기술)이거나 관련 내용이 없으면 '없음'이라고만 쓰세요."}],220)
        .then(function(t){
          // 영어가 그대로 섞인 불릿(3단어 이상 연속 영어)은 버린다
          t=t.split("\n").filter(function(l){return !/[A-Za-z]{3,}(\s+[A-Za-z]{2,}){2,}/.test(l)}).join("\n").trim();
          if(!t||/^없음/.test(t))return {r:r,t:""};
          // 관련성 확인: 질문의 핵심 주제에 직접 해당하는 내용인지 예/아니오로 묻는다
          return llm([{role:"system",content:"You judge relevance. Answer with only 예 or 아니오."},
            {role:"user",content:"질문: "+qctx+"\n\n노트:\n"+t.slice(0,900)+"\n\n이 노트는 질문의 핵심 주제(질문에서 묻는 바로 그 대상)에 대한 내용인가요? 비슷하지만 다른 대상(다른 종류의 제품·기술)이면 아니오."}],4)
            .then(function(v){return {r:r,t:/^아니/.test((v||"").trim())?"":t}}).catch(function(e){if(e.name==="AbortError")throw e;return {r:r,t:t}});
        }).then(function(x){done++;upd("노트 정리 중 ("+done+"/"+read.length+")");return x})
        .catch(function(e){if(e.name==="AbortError")throw e;return {r:r,t:""}});
    }).then(function(res){
      res.forEach(function(x){if(x&&x.t&&!/^없음/.test(x.t.trim()))notes.push(x)});
      end("노트 정리 완료 (누적 "+notes.length+"개)");
    });
  }
  step("조사 계획 세우는 중");
  var plan=[{role:"system",content:"Write 4 different short English web search queries (2-8 words each) that together help answer the user's question from different angles. One query per line, no numbering, no explanation."}];
  PLAN_SHOTS.forEach(function(x){plan.push({role:"user",content:"Question: "+x[0]});plan.push({role:"assistant",content:x[1]})});
  plan.push({role:"user",content:"Question: "+qctx});
  return llm(plan,90).then(function(t){
    var qs=parseQueries(t,4);
    return qs.length?qs:makeQuery(qctx).then(function(e){return e?[e]:[]});
  }).then(function(qs){
    end("1단계 계획: "+(qs.length?qs.join(" / "):qctx));
    step("검색하고 페이지 읽는 중 (0/"+Math.max(1,qs.length)+")");
    return runSearch(qs.length?qs:[""],1);
  }).then(function(fresh){
    end("1단계 검색 완료: 페이지 "+pages.length+"개 중 "+fresh.filter(function(r){return r.content&&r.content.length>150}).length+"개 본문을 읽었어요");
    a.sources=pages.slice(0,12);paint();
    return takeNotes(fresh,8);
  }).then(function(){
    // 2단계: 지금까지의 노트에서 빠진 부분을 스스로 찾는다
    if(!notes.length)return null;
    step("부족한 부분 찾는 중");
    var digest=notes.map(function(x){return x.t.split("\n").slice(0,2).join(" ")}).join("\n").slice(0,1800);
    return llm([{role:"system",content:"Given a research question and findings so far, write 3 short English web search queries (2-8 words) that would fill the most important gaps or verify uncertain claims. One per line, no numbering."},
                {role:"user",content:"Question: "+qctx+"\n\nFindings so far:\n"+digest}],70).then(function(t){
      var qs=parseQueries(t,3);end("2단계 보강 검색어: "+(qs.length?qs.join(" / "):"없음"));
      if(!qs.length)return null;
      step("검색하고 페이지 읽는 중 (0/"+qs.length+")");
      return runSearch(qs,2).then(function(fresh){
        end("2단계 검색 완료: 새 페이지 "+fresh.length+"개");a.sources=notes.map(function(x){return x.r}).concat(pages.filter(function(r){return !notes.some(function(x){return x.r===r})})).slice(0,14);paint();
        return takeNotes(fresh,4);
      });
    }).catch(function(e){if(e.name==="AbortError")throw e;});
  }).then(function(){
    if(!notes.length){a.searchErr="읽은 페이지에서 질문과 관련된 내용을 찾지 못했어요.";paint();return null}
    // 노트가 있는 페이지를 앞으로 정렬해서 1번부터 번호를 붙인다
    var used=notes.map(function(x){return x.r});
    a.sources=used.concat(pages.filter(function(r){return used.indexOf(r)<0})).slice(0,16);
    step("보고서 작성 중 (출처 "+notes.length+"개)");
    a.deep=true;
    return "아래는 딥 리서치 조사 노트입니다. 이 노트만 근거로 질문에 대한 상세한 보고서를 한국어로 쓰세요. 형식: 먼저 3문장 이내의 요약 → '## 핵심 내용'(불릿, 문장 끝에 [번호]) → '## 자세히'(소제목 여러 개, 각 소제목마다 근거와 [번호], 숫자·날짜는 노트 그대로) → '## 서로 다른 주장이나 불확실한 점'(출처끼리 다르거나 근거가 약한 내용을 구분해서) → '## 정리'. 모든 문장은 자연스러운 한국어로 쓰고 영어 문장을 그대로 붙이지 마세요(필요한 영어 용어는 괄호 안에만). 질문과 직접 관련 없는 노트는 쓰지 마세요. 노트에 없는 내용은 쓰지 말고, 가능한 한 많은 출처를 활용하되 전체 분량은 1500~2000자로 하세요.\n\n"+
      notes.map(function(x){return "["+(a.sources.indexOf(x.r)+1)+"] "+x.r.title+" ("+x.r.url+")\n"+x.t}).join("\n\n");
  }).catch(function(e){
    if(e.name==="AbortError")throw e;
    a.searchErr="딥 리서치 중 오류가 나서 일반 답변으로 대신해요: "+e.message;paint();return null;
  });
}

// 대화 앞에 붙일 참고 자료를 모은다: 링크 읽기 > 딥 리서치 > 웹 검색
function gather(c,a,paint,isV){
  if(isV)return Promise.resolve(null);
  var u=lastUser(c),text=u&&u.text?u.text.trim():"";
  if(!text)return Promise.resolve(null);
  var urls=(text.match(URL_RE)||[]).slice(0,2),q=text.replace(URL_RE,"").replace(/\s+/g," ").trim();
  if(urls.length)return readLinks(c,a,paint,urls,q);
  if(cfg.deep)return deepResearch(c,a,paint,q);
  if(cfg.web)return webSearch(c,a,paint,q);
  return Promise.resolve(null);
}

// ---------- Canvas ----------
var CV_KIND={html:"html",htm:"html",svg:"svg",markdown:"doc",md:"doc",javascript:"js",js:"js",mjs:"js",node:"js",python:"py",py:"py",mermaid:"mermaid",json:"json",csv:"csv",css:"css"};
var CV_RUN={js:1,py:1};   // 실행할 수 있는 종류
var CV_ICON={html:"🖥️",doc:"📄",svg:"🎨",js:"▶️",py:"🐍",mermaid:"🧭",json:"🧾",csv:"📊",css:"🎀",code:"💻"};
function cvKind(lang,code){
  lang=(lang||"").toLowerCase();
  if(CV_KIND[lang])return CV_KIND[lang];
  if(/^\s*<!doctype html|^\s*<html/i.test(code))return "html";
  return "code";
}
function cvTitle(b){
  var m;
  if(b.kind==="html"&&(m=b.code.match(/<title[^>]*>([^<]{1,60})<\/title>/i)))return m[1].trim();
  if(b.kind==="doc"&&(m=b.code.match(/^\s*#{1,3}\s+(.{1,60})/m)))return m[1].trim();
  if(b.kind==="js"||b.kind==="py"){m=b.code.match(/^\s*(?:#|\/\/)\s*(.{1,50})/);return m?m[1].trim():(b.kind==="py"?"Python":"JavaScript")}
  if(b.kind==="mermaid")return "다이어그램";if(b.kind==="json")return "JSON";if(b.kind==="csv")return "표(CSV)";if(b.kind==="css")return "CSS";
  return b.kind==="code"?(b.lang||"코드"):"";
}
// 답변 글에서 Canvas로 보낼 코드 블록(가장 긴 것)을 찾는다. 아직 닫히지 않은 블록(스트리밍 중)도 포함한다.
function cvFind(text){
  var re=/```([\w+-]*)[^\n]*\n([\s\S]*?)(```|$)/g,m,best=null;
  while((m=re.exec(text||""))){
    var code=m[2].replace(/\n$/,"");
    if(code.trim().length<20&&m[3])continue;
    var lang=(m[1]||"").toLowerCase();
    if(!best||code.length>best.code.length)best={lang:lang,code:code,kind:cvKind(lang,code),start:m.index,end:m.index+m[0].length,closed:m[3]==="```"};
    if(m[3]!=="```")break;
  }
  return best;
}
function cvStrip(text){var b=cvFind(text);return b&&b.closed?text.slice(0,b.start)+"[Canvas에 작성한 내용]"+text.slice(b.end):text}
function cvPush(c,b,title){
  var cv=c.canvas;
  if(!cv)cv=c.canvas={title:"",kind:b.kind,lang:b.lang,versions:[],v:0};
  cv.kind=b.kind;cv.lang=b.lang;cv.title=title||cvTitle(b)||cv.title;
  cv.versions.push(b.code);cv.v=cv.versions.length-1;
  return cv;
}
// 모델 답변에서 코드 블록을 찾아 Canvas 에 반영(스트리밍 중에는 같은 버전을 계속 갱신)
function cvSync(c,a,final){
  if(!cfg.canvas)return;
  var b=cvFind(a.text);if(!b)return;
  if(a.cv===undefined){var was=!c.canvas;cvPush(c,b);a.cv=c.canvas.v;cvTab="code"}
  else{var cv=c.canvas;cv.versions[a.cv]=b.code;cv.kind=b.kind;cv.lang=b.lang;cv.title=cvTitle(b)||cv.title}
  c.canvas.v=a.cv;
  cvOpenFlag=true;
  if(final&&c.canvas.kind!=="code")cvTab="view";
  cvRender(!final);
}
function cvRender(streaming_){
  var c=cur(),cv=c&&c.canvas,box=$("canvas");
  if(!cv||!cvOpenFlag){box.classList.remove("on");return}
  box.classList.add("on");
  var code=cv.versions[cv.v]||"",canView=cv.kind!=="code";
  if(!canView)cvTab="code";
  if($("cvTitle")!==document.activeElement)$("cvTitle").value=cv.title||"";
  $("cvVer").textContent=(cv.v+1)+"/"+cv.versions.length;
  $("cvPrev").disabled=cv.v<=0;$("cvNext").disabled=cv.v>=cv.versions.length-1;
  $("cvTabView").style.display=canView?"":"none";
  $("cvTabView").className="cv-tab"+(cvTab==="view"?" on":"");
  $("cvTabCode").className="cv-tab"+(cvTab==="code"?" on":"");
  var ta=$("cvCode");
  ta.style.display=cvTab==="code"?"block":"none";
  if(ta!==document.activeElement||streaming_)ta.value=code;
  if(streaming_&&cvTab==="code")ta.scrollTop=ta.scrollHeight;
  var showView=cvTab==="view"&&canView;
  var docKind={doc:1,json:1,csv:1,js:1,py:1}[cv.kind];
  $("cvRun").style.display=CV_RUN[cv.kind]?"":"none";
  $("cvTabView").textContent=CV_RUN[cv.kind]?"실행 결과":"미리보기";
  $("cvFrame").style.display=showView&&!docKind?"block":"none";
  $("cvDoc").style.display=showView&&docKind?"block":"none";
  if(showView){
    var key=cv.kind+"\n"+code;
    if(CV_RUN[cv.kind]){ if(!cvRunning&&cvLast!==key){cvLast=key;cvOutHTML='<div class="cv-out"><span class="s">▶ 실행 버튼을 누르면 샌드박스에서 코드를 실행해요.</span></div>';$("cvDoc").innerHTML=cvOutHTML} }
    else if(key!==cvLast){
      cvLast=key;$("cvErr").style.display="none";
      if(cv.kind==="doc")$("cvDoc").innerHTML=md(code);
      else if(cv.kind==="json")$("cvDoc").innerHTML=cvJson(code);
      else if(cv.kind==="csv")$("cvDoc").innerHTML=cvCsv(code);
      else $("cvFrame").srcdoc=cvHtmlFor(cv.kind,code);
    }
  }
}
function cvJson(code){

function run(c){
  var a={role:"assistant",text:""};c.msgs.push(a);
  var isV=vc.on, useVL=isV&&cfg.vmodel==="vl";     // 음성 대화: Audio(기본) 또는 VL(추론 끔) / 평소: VL
  streaming=true;ctrl=new AbortController();render();
  var spoken=0,started=false;
  function paint(){
    var els=document.querySelectorAll(".msg.assistant"),el=els[els.length-1];
    if(el){el.innerHTML=assistantInner(a,c.msgs.indexOf(a),true)}
    if(a.text&&cfg.canvas&&!isV)cvSync(c,a,false);
    var s=$("scroll");if(s.scrollHeight-s.scrollTop-s.clientHeight<160)toBottom();
  }
  // 문장이 완성되는 즉시 읽기 큐에 넣는다 → 답변이 끝나기 전에 첫 문장부터 말하기 시작
  function flushSpeech(final){
    if(!isV||!vc.on)return;
    var seg=a.text.slice(spoken),cut=-1,m,re=/[.!?。！？]+["')\]]*\s/g;
    while((m=re.exec(seg)))cut=m.index+m[0].length;
    if(cut<0){
      if(final)cut=seg.length;
      else if(seg.length>=80){var sp=seg.lastIndexOf(" ");if(sp>0)cut=sp+1}
    }
    if(cut<=0)return;
    var part=seg.slice(0,cut);
    if(!final&&speechText(part).length<6)return;
    spoken+=cut;
    chunkText(speechText(part)).forEach(function(t){vqPush(t)});
    if(!started){started=true;setVState("speaking")}
  }
  function done(){
    streaming=false;ctrl=null;delete a._t0;delete a.status;if(a.text&&cfg.canvas&&!isV)cvSync(c,a,true);saveChats();render(true);
    var idx=c.msgs.indexOf(a),ok=a.text&&!a.err&&idx>=0;
    if(vc.on){
      if(ok){flushSpeech(true);vqFinish(function(){if(vc.on)setVState("listening")})}
      else{vqReset();setVState("listening")}
    }else if(cfg.auto&&ok)speak(idx);
    if(ok)maybeCompact(c);
  }
  if(!cfg.api){a.err="서버 주소가 설정되지 않았습니다. 왼쪽 아래 ⚙️ 설정에서 입력하세요.";return done()}
  Promise.resolve().then(function(){ return gather(c,a,paint,isV) }).then(function(ctx){
    return isV?[ctx,"mini"]:pickModel(c,!!ctx).then(function(m){return [ctx,m]});
  }).then(function(pair){
    var ctx=pair[0],cmodel=pair[1];
    a.status="";
    a.model=isV?undefined:cmodel;
    var body={model:isV&&!useVL?"lfm3-audio":"raon-"+cmodel,messages:apiMessages(c,ctx),stream:true};
    if(isV){
      body.max_tokens=150;                                  // 음성 답변은 짧게(반복 루프 방지)
      if(useVL)body.chat_template_kwargs={enable_thinking:false};else body.repeat_penalty=1.1;
    }else{
      if(cfg.temp!=="")body.temperature=cfg.temp;
      if(!cfg.think)body.chat_template_kwargs={enable_thinking:false};
      if(cfg.effort&&caps.levels.indexOf(cfg.effort)>=0)body.reasoning_effort=cfg.effort;
      if(a.deep)body.max_tokens=1800;                       // 딥 리서치 보고서는 길게
    }
    return fetch((isV&&!useVL?vbase():(useVL?nanoBase():modelBase(cmodel)))+"/v1/chat/completions",{method:"POST",headers:headers(),signal:ctrl.signal,body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error("서버 오류 "+r.status+(r.status===401?" (API 키를 확인하세요)":"")+" "+t.slice(0,200))});
    var rd=r.body.getReader(),dec=new TextDecoder(),buf="";
    function pump(){
      return rd.read().then(function(x){
        if(x.done)return;
        buf+=dec.decode(x.value,{stream:true});
        var lines=buf.split("\n");buf=lines.pop();
        lines.forEach(function(l){
          l=l.trim();if(l.indexOf("data:")!==0)return;
          var d=l.slice(5).trim();if(d==="[DONE]")return;
          try{
            var j=JSON.parse(d),dl=j.choices&&j.choices[0]&&j.choices[0].delta;if(!dl)return;
            if(dl.reasoning_content){if(!a.reasoning){a.reasoning="";a._t0=Date.now()}a.reasoning+=dl.reasoning_content;paint()}
            if(dl.content){
              if(a._t0&&!a.thinkMs)a.thinkMs=Date.now()-a._t0;
              a.text+=dl.content;paint();flushSpeech(false);
            }
          }catch(e){}
        });
        return pump();
      });
    }
    return pump();
  }).catch(function(e){
    if(e.name==="AbortError"){if(!a.text&&!a.reasoning)c.msgs.pop()}
    else a.err=(a.text?"\n\n":"")+"연결 실패: "+e.message;
  }).then(done);
}

function toast(msg){
  var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);

function toWav(buf){
  var d=buf.getChannelData(0),n=d.length,ab=new ArrayBuffer(44+n*2),v=new DataView(ab);
  function w(o,str){for(var i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))}
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  for(var i=0;i<n;i++){var x=Math.max(-1,Math.min(1,d[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true)}
  return ab;
}
function b64(ab){
  var bytes=new Uint8Array(ab),bin="",CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);
}
function resample16k(buf){       // AudioBuffer -> 16kHz 모노 AudioBuffer
  var oc=new OfflineAudioContext(1,Math.max(1,Math.ceil(buf.duration*16000)),16000),src=oc.createBufferSource();
  src.buffer=buf;src.connect(oc.destination);src.start();
  return oc.startRendering();
}
function blobToWav16k(blob){     // 녹음 파일(webm/mp4 등) -> WAV
  return blob.arrayBuffer().then(function(ab){
    var AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();
    return ctx.decodeAudioData(ab).then(function(buf){ctx.close();return resample16k(buf)});
  }).then(toWav);
}

function startRec(){
  if(!cfg.api){toast("먼저 설정에서 서버 주소를 입력하세요");return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("이 브라우저는 녹음을 지원하지 않습니다");return}
  stopSpeak();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mr=new MediaRecorder(stream),chunks=[];
    rec={mr:mr,t0:Date.now(),timer:setTimeout(stopRec,60000)};
    mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop()});
      clearTimeout(rec.timer);var dur=Date.now()-rec.t0;rec=null;
      if(dur<600||!chunks.length){setMic("");toast("너무 짧아요. 다시 말해 주세요");return}
      asrBusy=true;setMic("wait");
      blobToWav16k(new Blob(chunks,{type:mr.mimeType})).then(transcribe).then(function(text){
        if(!text){toast("음성을 인식하지 못했어요");return}
        var i=$("input");i.value=(i.value?i.value+" ":"")+text;autosize();updateSend();i.focus();
      }).catch(function(e){toast("음성 인식 실패: "+e.message)}).then(function(){asrBusy=false;setMic("")});
    };
    mr.start();setMic("rec");
  }).catch(function(){toast("마이크 권한이 필요합니다")});
}

function speechText(t){
  return t.replace(/```[\s\S]*?```/g," ").replace(/`([^`]*)`/g,"$1").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1")
    .replace(/^\s*[-*]\s+/gm,"").replace(/^\s*\d+\.\s+/gm,"").replace(/[*#>_~]/g," ").replace(/\s+/g," ").trim();
}
function chunkText(t){
  var parts=t.split(/(?<=[.!?。！？])\s+/),out=[],cur="";
  parts.forEach(function(p){
    while(p.length>180){out.push(p.slice(0,180));p=p.slice(180)}
    if((cur+" "+p).length>120&&cur){out.push(cur);cur=p}else cur=cur?cur+" "+p:p;
  });
  if(cur)out.push(cur);
  return out.filter(function(x){return x.trim()});
}
function fetchTTS(txt){
  if(cfg.tts==="kss")return fetch(base()+"/tts",{method:"POST",headers:headers(),body:JSON.stringify({text:txt})})
    .then(function(r){if(!r.ok)throw new Error("서버 오류 "+r.status);return r.blob()});
  return fetch(vbase()+"/v1/audio/speech",{method:"POST",headers:headers(),body:JSON.stringify({model:"tts",input:txt,voice:cfg.voice,lang:cfg.lang,response_format:"wav"})})
    .then(function(r){if(!r.ok)throw new Error("서버 오류 "+r.status);return r.blob()});
}
function refreshSpeak(){
  var els=document.querySelectorAll('[data-act="speak"]');
  for(var i=0;i<els.length;i++){var on=+els[i].getAttribute("data-i")===player.idx;els[i].innerHTML=on?ICON_STOP:ICON_SPEAK;els[i].title=on?"읽기 중지":"소리 내어 읽기"}
}
function stopSpeak(){
  vqReset();
  player.gen++;
  if(player.audio){try{player.audio.pause()}catch(e){}player.audio=null}
  player.idx=-1;refreshSpeak();
}
function speak(idx,onEnd){
  var c=cur(),m=c&&c.msgs[idx];if(!m||!m.text){if(onEnd)onEnd();return}
  var chunks=chunkText(speechText(m.text));if(!chunks.length){if(onEnd)onEnd();return}
  stopSpeak();var gen=player.gen;player.idx=idx;refreshSpeak();
  function finish(){if(gen===player.gen){player.idx=-1;player.audio=null;refreshSpeak();if(onEnd)onEnd()}}
  var next=fetchTTS(chunks[0]);
  (function step(i){
    if(gen!==player.gen)return;
    if(i>=chunks.length){finish();return}
    next.then(function(blob){
      if(gen!==player.gen)return;
      var pre=i+1<chunks.length?fetchTTS(chunks[i+1]):null;
      var url=URL.createObjectURL(blob),a=new Audio(url);player.audio=a;
      a.onended=a.onerror=function(){URL.revokeObjectURL(url);next=pre;step(i+1)};
      a.play().catch(function(){toast("소리 재생이 차단됐어요. 스피커 버튼을 눌러 주세요");if(gen===player.gen){stopSpeak();if(onEnd)onEnd()}});
    }).catch(function(e){if(gen===player.gen){toast("음성 출력 실패: "+e.message);stopSpeak();if(onEnd)onEnd()}});
  })(0);
}

/* ---------- 음성 대화용 문장 단위 재생 큐 ---------- */
function vqReset(){
  vq.gen++;vq.items=[];vq.playing=false;vq.finished=false;vq.onEnd=null;
  if(player.audio){try{player.audio.pause()}catch(e){}player.audio=null}
}
function vqPush(txt){
  txt=speechText(txt);if(!txt)return;
  vq.items.push({txt:txt,p:null});vqPlay();
}
function vqFinish(cb){vq.finished=true;vq.onEnd=cb;vqPlay()}
function vqPlay(){
  for(var k=0;k<Math.min(2,vq.items.length);k++)if(!vq.items[k].p)vq.items[k].p=fetchTTS(vq.items[k].txt);   // 다음 두 문장까지 미리 합성
  if(vq.playing)return;
  var it=vq.items[0];
  if(!it){if(vq.finished&&vq.onEnd){var f=vq.onEnd;vq.onEnd=null;f()}return}
  vq.playing=true;var gen=vq.gen;
  function next(){if(gen!==vq.gen)return;vq.items.shift();vq.playing=false;vqPlay()}
  it.p.then(function(blob){
    if(gen!==vq.gen)return;
    var url=URL.createObjectURL(blob),au=new Audio(url);player.audio=au;
    au.onended=au.onerror=function(){URL.revokeObjectURL(url);next()};
    au.play().catch(function(){toast("소리 재생이 차단됐어요");next()});
  }).catch(function(e){if(gen===vq.gen){toast("음성 출력 실패: "+e.message);next()}});
}

/* ---------- 롤링 메모리 압축 (긴 대화에서 컨텍스트·KV 캐시·프리필 시간을 일정하게 유지) ----------
   오래된 대화는 통째로 지우는 대신, 나중에 다시 물어볼 만한 "사실 문장"(코드·번호·날짜·시간·연락처·기억 요청·건강/선호 정보)만
   규칙으로 뽑아 메모리에 덧붙이고 원문은 버린다. 모델을 쓰지 않으므로 즉시 끝나고, 2B 모델의 요약 실패(원문 베끼기)를 피한다. */
var CP={trigger:3000,keep:6,maxLines:60};              // 라이브 대화가 약 3000토큰을 넘으면 최근 6개 메시지만 남기고 정리
function estTok(s){return Math.ceil(s.length/1.5)}     // 한국어 기준 보수적 추정(실측 1.45자/토큰)
function liveMsgs(c){return c.msgs.slice(c.memStart||0)}
function liveTokens(c){var t=estTok(c.memory||"");liveMsgs(c).forEach(function(m){t+=estTok(m.text||"")+(m.img?400:0)});return t}
function extractFacts(ms){
  var out=[];
  ms.forEach(function(m){
    if(m.role!=="user"||!m.text)return;
    m.text.split(/(?<=[.!?。])\s+|\n/).forEach(function(sn){
      sn=sn.trim();if(!sn)return;
      var sc=0;
      if(/\d{3,}/.test(sn))sc+=2;                                                           // 3자리 이상 숫자(코드·번호·연도·전화)
      if(/\d{1,2}\s*시|\d{1,2}월\s*\d{1,2}일|\d{4}-\d{2}-\d{2}|\d{1,2}:\d{2}/.test(sn))sc+=2; // 날짜·시간
      if(/@|https?:\/\//.test(sn))sc+=2;                                                    // 메일·주소
      if(/약속|마감|비밀번호|주소|예약|알레르기|못 먹|이름은|취미|좋아해|싫어해|password|address|appointment|deadline|allergic|my name is|favorite|hobby/i.test(sn))sc+=2;
      if(/기억해|잊지|remember|don't forget/i.test(sn))sc+=1;                                // "꼭 기억해 줘"만으로는 보관하지 않음(숫자·사실과 함께일 때만)
      if(sc>=2)out.push("- "+sn.slice(0,200));
    });
  });
  return out;
}
function memNote(c){
  return '<details class="memnote"><summary>⋯ 이전 대화 '+(c.memStart||0)+'개 메시지는 정리했어요 (기억할 사실만 남김)</summary><div class="tr">'+esc(c.memory||"(기억할 사실이 없었어요)")+"</div></details>";
}
function maybeCompact(c){
  var live=liveMsgs(c);
  if(liveTokens(c)<=CP.trigger||live.length<=CP.keep)return;
  var from=c.memStart||0,cut=from+live.length-CP.keep;
  var mem=c.memory?c.memory.split("\n"):[],seen={};
  mem.forEach(function(l){seen[l.replace(/\s/g,"")]=1});
  extractFacts(c.msgs.slice(from,cut)).forEach(function(l){var k=l.replace(/\s/g,"");if(!seen[k]){seen[k]=1;mem.push(l)}});
  if(mem.length>CP.maxLines)mem=mem.slice(mem.length-CP.maxLines);   // 메모리도 상한을 둔다(가장 오래된 줄부터 버림)
  c.memory=mem.join("\n");c.memStart=cut;
  saveChats();if(cur()===c)render(true);
}

/* ---------- 음성 대화 (연속 대화: 듣기 → 인식 → 답변 → 읽기 → 다시 듣기) ---------- */
var VTEXT={listening:"듣고 있어요…",thinking:"생각 중…",speaking:"말하는 중…"};
function setVState(st){
  vc.state=st;$("voicebar").setAttribute("data-st",st);
  $("vtext").textContent=vc.muted&&st==="listening"?"마이크가 꺼져 있어요":(VTEXT[st]||"");
}
function startVoice(){
  if(vc.on||streaming||asrBusy||rec)return;
  if(!cfg.api){toast("먼저 설정에서 서버 주소를 입력하세요");return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("이 브라우저는 마이크를 지원하지 않습니다");return}
  stopSpeak();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(stream){
    var AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();
    var src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(2048,1,1);
    vc={on:true,state:"listening",stream:stream,ctx:ctx,src:src,proc:proc,muted:false,pre:[],buf:[],inSpeech:false,lastLoud:0,t0:0,floor:0.004,thr:0.02};
    proc.onaudioprocess=onVoiceFrame;
    src.connect(proc);proc.connect(ctx.destination);
    $("vMute").className="vbtn";
    document.body.classList.add("voice");setVState("listening");
  }).catch(function(){toast("마이크 권한이 필요합니다")});
}
function stopVoice(){
  if(!vc.on)return;
  vc.on=false;
  try{vc.proc.disconnect();vc.src.disconnect()}catch(e){}
  try{vc.stream.getTracks().forEach(function(t){t.stop()})}catch(e){}
  try{vc.ctx.close()}catch(e){}
  stopSpeak();if(ctrl)ctrl.abort();
  document.body.classList.remove("voice");
  $("orb").style.setProperty("--lvl","0");
}
function onVoiceFrame(e){
  if(!vc.on)return;
  var d=e.inputBuffer.getChannelData(0),sum=0,i;
  for(i=0;i<d.length;i++)sum+=d[i]*d[i];
  var rms=Math.sqrt(sum/d.length),now=Date.now();
  $("orb").style.setProperty("--lvl",vc.muted?"0":Math.min(1,rms*8).toFixed(2));
  if(vc.state!=="listening"||vc.muted){vc.pre=[];vc.inSpeech=false;vc.buf=[];return}
  var chunk=new Float32Array(d);
  if(!vc.inSpeech){
    var thr=Math.max(0.02,vc.floor*3);
    if(rms<thr)vc.floor=vc.floor*0.95+rms*0.05;      // 주변 소음 수준 추정
    vc.pre.push(chunk);if(vc.pre.length>7)vc.pre.shift();
    if(rms>thr){vc.inSpeech=true;vc.buf=vc.pre.slice();vc.pre=[];vc.t0=now;vc.lastLoud=now;vc.thr=thr}
  }else{
    vc.buf.push(chunk);
    if(rms>vc.thr)vc.lastLoud=now;
    if(now-vc.lastLoud>1300||now-vc.t0>30000)finishUtterance();
  }
}
function finishUtterance(){
  var buf=vc.buf,dur=vc.lastLoud-vc.t0;
  vc.buf=[];vc.inSpeech=false;
  if(dur<350)return;                                   // 짧은 잡음은 무시
  setVState("thinking");
  var n=0;buf.forEach(function(b){n+=b.length});
  var ab=vc.ctx.createBuffer(1,n,vc.ctx.sampleRate),ch=ab.getChannelData(0),o=0;
  buf.forEach(function(b){ch.set(b,o);o+=b.length});
  resample16k(ab).then(toWav).then(transcribe).then(function(text){
    if(!vc.on)return;
    if(!text){setVState("listening");return}
    send(text);
  }).catch(function(e){toast("음성 인식 실패: "+e.message);if(vc.on)setVState("listening")});
}

$("file").addEventListener("change",function(){
  var f=this.files[0];this.value="";if(!f)return;
  var img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){
    var s=Math.min(1,1024/Math.max(img.width,img.height)),cv=document.createElement("canvas");
    cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    pendingImg=cv.toDataURL("image/jpeg",0.85);URL.revokeObjectURL(url);
    $("preview").className="preview on";
    $("preview").innerHTML='<div class="pv"><img src="'+pendingImg+'" alt=""><button class="x" id="rmImg">✕</button></div>';
    updateSend();
  };
  img.src=url;
});

var mobile=function(){return window.matchMedia("(max-width:760px)").matches};
function closeMobile(){if(mobile()){$("side").classList.remove("open");$("side").classList.add("hidden");$("scrim").classList.remove("on")}}
$("closeSide").addEventListener("click",function(){if(mobile())closeMobile();else $("side").classList.add("hidden")});
$("openSide").addEventListener("click",function(){if(mobile()){$("side").classList.remove("hidden");$("side").classList.add("open");$("scrim").classList.add("on")}else $("side").classList.remove("hidden")});
$("scrim").addEventListener("click",closeMobile);

/* theme */
(function(){var t=LS.get("lfm.theme","");if(t)document.documentElement.setAttribute("data-theme",t)})();
$("themeBtn").addEventListener("click",function(){
  var el=document.documentElement,isDark=el.getAttribute("data-theme")==="dark"||(!el.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  var n=isDark?"light":"dark";el.setAttribute("data-theme",n);LS.set("lfm.theme",n);
});

/* settings */
function openSettings(){
  $("sApi").value=cfg.api;$("sKey").value=cfg.key;$("sSys").value=cfg.sys;$("sTemp").value=cfg.temp;
  $("sLang").value=cfg.lang;$("sVoice").value=cfg.voice;$("sAuto").checked=cfg.auto;$("sVmodel").value=cfg.vmodel;
  $("modalBg").classList.add("on");closeMobile();
}
$("settingsBtn").addEventListener("click",openSettings);
$("sCancel").addEventListener("click",function(){$("modalBg").classList.remove("on")});
$("modalBg").addEventListener("click",function(e){if(e.target===this)this.classList.remove("on")});
$("sSave").addEventListener("click",function(){
  cfg.api=$("sApi").value.trim();cfg.key=$("sKey").value.trim();cfg.sys=$("sSys").value;
  var tv=parseFloat($("sTemp").value);cfg.temp=isNaN(tv)?"":Math.max(0,Math.min(2,tv));
  cfg.lang=$("sLang").value;cfg.voice=$("sVoice").value;cfg.auto=$("sAuto").checked;cfg.vmodel=$("sVmodel").value;
  saveCfg();$("modalBg").classList.remove("on");checkHealth();
});

/* 패치노트 */
$("patchOk").addEventListener("click",closePatches);
$("patchBg").addEventListener("click",function(e){if(e.target===this)closePatches()});
$("patchAll").addEventListener("click",function(){showPatches(true)});
$("sPatch").addEventListener("click",function(){$("modalBg").classList.remove("on");showPatches(true)});

/* init */
if(!cur()){if(chats.length)curId=chats[0].id;else newChat()}
if(mobile())$("side").classList.add("hidden");
render();checkHealth();
if(!cfg.api)setTimeout(openSettings,300);
else setTimeout(function(){showPatches(false)},600);
})();
</script>
</body>
</html>
