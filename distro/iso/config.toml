# bootc-image-builder settings for the installer ISO.
# The installer asks for language, disk and user account interactively;
# nothing here pre-creates users or passwords.

[customizations.installer.kickstart]
contents = """
# Point installed systems at the published image so `bootc upgrade` and the
# automatic update timer pull new releases from the registry.
%post --erroronfail
bootc switch --mutate-in-place --transport registry ghcr.io/OWNER/nuri:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Users"
]
