# Builds the OS image on every push and publishes it to GitHub Container
# Registry. Installed machines follow ghcr.io/<owner>/nuri:latest.
# This file takes effect once `distro/` is its own repository (workflows only
# run from the repository root's .github/workflows).
name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 2"   # weekly rebuild to pick up Fedora security updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nuri
  FEDORA_VERSION: "45"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GUI test dependencies (off-screen Qt + Korean fonts)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libxkbcommon0 fonts-noto-cjk
          pip install PyQt6
      - run: make lint test

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the desktop image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        run: |
          podman build -f Containerfile \
            --build-arg FEDORA_VERSION=$FEDORA_VERSION \
            --build-arg NURI_VERSION=${GITHUB_SHA::7} \
            -t $IMAGE:${GITHUB_SHA::7} .

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          podman push $IMAGE:${GITHUB_SHA::7}
          podman tag $IMAGE:${GITHUB_SHA::7} $IMAGE:latest
          podman push $IMAGE:latest
